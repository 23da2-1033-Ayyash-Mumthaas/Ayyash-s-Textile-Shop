name: textile_mobile_app
description: "Ayyash's Textile Shop - Admin & Customer Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  cached_network_image: ^3.4.1
  responsive_framework: ^1.5.1
  google_fonts: ^6.3.0

  shared_preferences: ^2.5.3
  provider: ^6.1.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.8
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/
